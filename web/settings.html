<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n>AI InferPeek 设置</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api/i18n.js"></script>
    <script type="module" src="settings.js"></script>
  </head>
  <body class="settings-page">
    <header class="topbar">
      <a class="brand brand-link" href="./">AI InferPeek</a>
      <div class="machine" data-i18n>设置</div>
      <div class="topbar-actions">
        <a class="btn" href="./" data-i18n>返回看板</a>
      </div>
    </header>
    <main class="settings" id="settings">
      <p class="empty" data-i18n>正在读取设置…</p>
    </main>
    <footer class="save-bar" id="save-bar" hidden>
      <button type="button" class="btn btn-primary" id="save" disabled data-i18n>保存</button>
      <button type="button" class="btn" id="revert" disabled data-i18n>撤销修改</button>
      <span class="save-msg" id="save-msg" role="status" aria-live="polite"></span>
    </footer>
  </body>
</html>
